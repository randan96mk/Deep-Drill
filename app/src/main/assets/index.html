<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Deep Drill</title>
<style>
html,body{margin:0;height:100%;background:#14110f;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eee}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none;z-index:3}
.row{display:flex;gap:8px}
.panel{flex:1;min-width:0;border-radius:12px;padding:7px 8px 8px;background:linear-gradient(#2d2925,#1a1714);border:1px solid #4d453d;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 5px 14px rgba(0,0,0,.55)}
.lbl{display:block;font-size:10px;letter-spacing:.18em;color:#a79b8d;font-weight:700}
.lcd,.val{display:block;margin-top:3px;padding:2px 5px;border-radius:6px;box-shadow:inset 0 2px 5px #000;font:700 17px ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.lcd{background:#07110b;color:#7dffb2;text-shadow:0 0 8px rgba(125,255,178,.65)}
.val{background:#140f05;color:#ffd45a;text-shadow:0 0 8px rgba(255,200,60,.55)}
#up{flex:none;width:82px;padding:0;border:2px solid #1b5a28;border-radius:8px;background:linear-gradient(135deg,#86d894,#2f8a43 55%,#52b064);box-shadow:0 3px 0 #123d1b,0 6px 12px rgba(0,0,0,.5);pointer-events:auto;color:#0f3d1a;letter-spacing:0;cursor:pointer;transform:rotate(2deg);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:system-ui,sans-serif}
#up::before{content:"";position:absolute;inset:3px;border:1px dashed rgba(15,61,26,.55);border-radius:5px;pointer-events:none}
#up .amt{font-size:21px;font-weight:900}
#up .sub{font-size:9px;font-weight:800;letter-spacing:.14em}
#up .lv{font-size:10px;font-weight:800;background:#0f3d1a;color:#b6ffc3;border-radius:6px;padding:1px 6px;margin-top:1px}
#up.dis{filter:grayscale(.9) brightness(.65)}
#up.ready{animation:glow 1.2s infinite}
#up:active{transform:rotate(2deg) translateY(2px);box-shadow:0 1px 0 #123d1b}
@keyframes glow{50%{box-shadow:0 3px 0 #123d1b,0 0 0 6px rgba(120,255,150,.28),0 6px 12px rgba(0,0,0,.5)}}
#surf{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:3;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:linear-gradient(#ffc24a,#e8820c);box-shadow:0 4px 0 #8a4a00,0 8px 16px rgba(0,0,0,.55);color:#2a1600;font:800 9px system-ui,sans-serif;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
#surf svg{width:22px;height:22px;transition:transform .2s}
#surf.down svg{transform:rotate(180deg)}
#surf:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4a00}
#surf.off{display:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,6,.76);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
.ov.hide{display:none}
.card{width:min(84vw,340px);text-align:center;padding:24px 22px;border-radius:18px;background:linear-gradient(#2f2a25,#1a1714);border:1px solid #574d43;box-shadow:0 14px 40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1)}
.card h1{margin:0 0 10px;font-size:32px;letter-spacing:.14em;color:#ffd45a;text-shadow:0 2px 0 #7a4b00,0 0 18px rgba(255,190,50,.45)}
.card p{margin:0 0 18px;font-size:15px;line-height:1.5;color:#cfc5b9}
#go{font:800 17px system-ui,sans-serif;letter-spacing:.04em;color:#2a1600;border:0;border-radius:12px;padding:14px 26px;background:linear-gradient(#ffc24a,#e8820c);box-shadow:0 4px 0 #8a4a00,0 8px 16px rgba(0,0,0,.5);cursor:pointer}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4a00}
#reset{display:block;margin-top:16px;font-size:12px;color:#8d8275;text-decoration:underline;cursor:pointer}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);z-index:2;padding:12px 22px;border-radius:30px;font:800 14px system-ui,sans-serif;letter-spacing:.2em;color:#ffe9b0;background:rgba(20,15,10,.7);border:1px solid rgba(255,200,90,.5);pointer-events:none;transition:opacity .25s;animation:pulse 1.4s infinite;white-space:nowrap}
#hint.off{opacity:0}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,190,70,.12)}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <div class="panel"><span class="lbl">DEPTH</span><span class="lcd" id="depth">-10 ft</span></div>
    <div class="panel"><span class="lbl">CASH</span><span class="val" id="money">$0</span></div>
    <button id="up" class="dis" aria-label="Upgrade drill for 100 dollars"><span class="amt">$100</span><span class="sub">UPGRADE</span><span class="lv" id="lv">LV 1</span></button>
  </div>
</div>

<button id="surf" class="off" aria-label="Go to surface"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5 12l7-7 7 7"/></svg><span id="surfT">SURFACE</span></button>

<div id="hint" class="off">HOLD TO DRILL</div>

<div id="start" class="ov">
  <div class="card">
    <h1>DEEP DRILL</h1>
    <p>Hold anywhere to lower the drill and dig.<br>Tap SURFACE to ride back up to the grass.<br>Tap the $100 note to upgrade the drill.</p>
    <button id="go">Start drilling</button>
    <a id="reset">Reset progress</a>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game');
let ctx=cv.getContext('2d',{alpha:false});

const MR=[
['coal','Coal',0,60,14,1.2,2,'nug','#6a6a72','#17171a'],
['copper','Copper',0,90,12,1.5,3,'nug','#f4aa72','#a24e1c'],
['tin','Tin',0,90,9,1.5,4,'nug','#c9d6e2','#6a7a8c'],
['iron','Iron',10,150,9,1.8,5,'nug','#d7a58b','#6b3a2a'],
['shell','Fossil shell',5,120,5,1.6,8,'shell','#f1e3c3','#a88f5c'],
['silver','Silver',25,300,10,2,8,'nug','#f6f9fb','#8995a1'],
['lead','Lead',20,200,8,1.9,6,'nug','#9aa3b5','#3f4658'],
['quartz','Quartz',40,350,9,2,12,'cry','#eef2ff','#9fb0e6'],
['amber','Amber',50,400,6,2.2,18,'amber','#ffd27a','#c9731a'],
['bones','Fossil bones',40,300,5,2.2,15,'bones','#f4eddc','#b8aa8a'],
['gold','Gold',90,700,8,2.6,25,'nug','#ffe78a','#b07a0b'],
['jade','Jade',100,600,6,2.6,30,'cab','#9ff0c0','#1f8a55'],
['amethyst','Amethyst',120,800,6,2.8,40,'cry','#e6c8ff','#8a4fd6'],
['topaz','Topaz',150,900,5,3,45,'dia','#ffe0a0','#e08a1a'],
['coin','Ancient coin',100,700,4,2.4,55,'coin','#ffe27a','#a8740a'],
['ruby','Ruby',250,1500,5,3.2,70,'hex','#ff8aa0','#a3001f'],
['sapphire','Sapphire',280,1600,5,3.3,85,'oval','#9ab8ff','#1a3fa8'],
['emerald','Emerald',300,1800,4,3.4,100,'oct','#8dffc6','#00733f'],
['opal','Opal',320,1800,4,3.4,120,'opal','#f2f6ff','#b8a0e6'],
['pot','Old pottery',300,1500,4,3.2,130,'pot','#d98b5a','#7b3a1d'],
['platinum','Platinum',350,2000,4,3.4,150,'nug','#dfe9ff','#7f93b3'],
['diamond','Diamond',600,4000,3.5,4.2,250,'diam','#ffffff','#7fd9ee'],
['bopal','Black opal',700,4000,3,4.4,300,'opal','#6a5aa8','#0b0820'],
['meteor','Meteorite',600,5000,3,4.4,350,'met','#7a7a84','#222226'],
['skull','Dinosaur skull',700,4000,2.5,4.6,400,'skull','#f1ead8','#a89c7e'],
['chest','Treasure chest',600,1e9,2,4.2,500,'chest','#c98a3c','#6b3d12'],
['alex','Alexandrite',1400,6000,3,5,700,'oct','#7fe0c0','#7a1fa0'],
['tanz','Tanzanite',1500,7000,3,5.2,800,'dia','#8aa0ff','#4a1fa8'],
['irid','Iridium',1500,8000,3,5.2,900,'nug','#e6eaf0','#5a6d8a'],
['geode','Crystal geode',1800,8000,2.5,5.4,1000,'geode','#6a6070','#d9a8ff'],
['idol','Golden idol',2500,1e9,1.5,5.8,1500,'idol','#ffe27a','#a8740a'],
['star','Starstone',4000,1e9,2.5,6,2500,'star','#fbeaff','#8a3cff'],
['void','Void crystal',5000,1e9,2,6.4,4000,'void','#8a3cff','#12002a'],
['relic','Alien relic',6000,1e9,1.5,6.8,5500,'relic','#7dffe0','#0a5a52'],
['core','Core heart',8000,1e9,1,7.5,8000,'core','#ffd070','#d02a10']
];
const COLX={coal:'#b8b8c4',bopal:'#b79cff',meteor:'#c0c0cc',void:'#c58bff',core:'#ffb070',lead:'#c0c8dc',iron:'#e0a080',topaz:'#ffc060',pot:'#e8a070'};
const M=MR.map(r=>({id:r[0],name:r[1],min:r[2],max:r[3],w:r[4],time:r[5],val:r[6],kind:r[7],c1:r[8],c2:r[9],col:COLX[r[0]]||r[8]}));
const LIVE={star:1,void:1,relic:1,core:1};
const FILLW=55;
const ST=[[0,[112,80,52]],[40,[140,84,54]],[120,[168,138,94]],[300,[100,102,108]],[700,[58,66,84]],[1500,[62,50,108]],[3000,[44,38,48]],[5000,[110,34,22]],[8000,[96,40,128]],[12000,[40,70,130]]];
const BAND=['#ff8a3c','#ffd23c','#4cd6ff','#b36bff','#ff5d8f','#5dff9a','#ffffff','#ff3b30'];
const UCOST=100;
const KEY='deepdrill.v2';

let W=0,H=0,DPR=1,bs=60,step=64,shaftW=90,cx=0,tipY=0,rigY0=0,hudH=80;
let money=0,row=0,lvl=1,started=false,holding=false;
let mode='surf',vp=1,vpE=1,eng=0,time=0,scrollOff=0,phase=0,disp=0,last=0,dustT=0,fxT=0,drilling=false;
let blocks=[],parts=[],floats=[];

try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){money=s.money|0;row=s.row|0;lvl=Math.max(1,s.lvl|0||1)}}catch(e){}
disp=money;
function save(){try{localStorage.setItem(KEY,JSON.stringify({money,row,lvl}))}catch(e){}}
const power=()=>1+.4*(lvl-1);

const hh=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const rnd=(a,b)=>a+Math.random()*(b-a);
const rgb=(c,k=1,a=1)=>{let r=c[0],g=c[1],b=c[2];if(k<1){r*=k;g*=k;b*=k}else if(k>1){const m=k-1;r+=(255-r)*m;g+=(255-g)*m;b+=(255-b)*m}return 'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+a+')'};
function strata(d){
 d=Math.max(0,d);let i=0;
 while(i<ST.length-2&&d>ST[i+1][0])i++;
 const a=ST[i],b=ST[i+1],t=Math.min(1,Math.max(0,(d-a[0])/(b[0]-a[0])));
 return [a[1][0]+(b[1][0]-a[1][0])*t,a[1][1]+(b[1][1]-a[1][1])*t,a[1][2]+(b[1][2]-a[1][2])*t];
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

const TH=640;
let TS=1,tiles={},curBi=0;
const AMB=[];for(let i=0;i<30;i++)AMB.push({x:Math.random(),y:Math.random(),s:Math.random(),ph:Math.random()*6.28});
const AMBC=['rgba(214,184,140,','rgba(214,170,130,','rgba(232,208,152,','rgba(214,214,224,','rgba(120,255,220,','rgba(232,200,255,','rgba(255,150,60,','rgba(255,170,60,','rgba(120,240,255,'];
function rngf(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
const tri=f=>{f(-TH);f(0);f(TH)};
function wob(g,pts,dy,col,w){
 g.beginPath();
 pts.forEach((p,i)=>{if(i)g.lineTo(p[0],p[1]+dy);else g.moveTo(p[0],p[1]+dy)});
 g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.stroke();
}
function walk(R,x,y,a,n,len,jit){
 const pts=[[x,y]];
 for(let i=0;i<n;i++){a+=(R()-.5)*jit;x+=Math.cos(a)*len*(.6+R()*.8);y+=Math.sin(a)*len*(.6+R()*.8);pts.push([x,y])}
 return pts;
}
function dSoil(g,R){
 for(let k=0;k<46;k++){
  const x=R()*W,y=R()*TH,r=2+R()*6,c=R()<.5?'#8f8a80':'#b49a74',a=R()*3;
  tri(dy=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y+dy,r,r*.75,a,0,7);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x+1,y+dy+1.3,r,r*.7,a,0,7);g.fill()});
 }
 for(let k=0;k<12;k++){
  const p=walk(R,R()*W,R()*TH,1.2+R()*.7,8,14,.9);
  tri(dy=>{wob(g,p,dy,'#3b2614',3.2);wob(g,p,dy,'#7a5530',1.5)});
 }
}
function dClay(g,R){
 for(let k=0;k<16;k++){
  const y=R()*TH,ph=R()*6,w=2+R()*5,pts=[];
  for(let x=0;x<=W;x+=20)pts.push([x,y+Math.sin(x*.03+ph)*6]);
  tri(dy=>{wob(g,pts,dy,'rgba(60,20,10,.28)',w);wob(g,pts,dy+w,'rgba(255,180,120,.12)',1.5)});
 }
 for(let k=0;k<7;k++){
  const x=20+R()*(W-40),y=R()*TH,r=8+R()*7,a0=R()*6;
  tri(dy=>{
   g.fillStyle='rgba(240,225,190,.55)';g.beginPath();g.arc(x,y+dy,r,0,7);g.fill();
   g.beginPath();for(let a=0;a<11;a+=.25){const rr=r*.92*a/11;g.lineTo(x+Math.cos(a+a0)*rr,y+dy+Math.sin(a+a0)*rr)}
   g.strokeStyle='rgba(80,50,30,.6)';g.lineWidth=1.2;g.stroke();
  });
 }
 for(let k=0;k<6;k++){
  const x=20+R()*(W-40),y=R()*TH,a=R()*3,L=18+R()*14;
  tri(dy=>{
   g.save();g.translate(x,y+dy);g.rotate(a);g.fillStyle='rgba(240,230,200,.55)';g.fillRect(-L/2,-2.5,L,5);
   for(const sx of [-1,1])for(const sy of [-1,1]){g.beginPath();g.arc(sx*L/2,sy*3,3,0,7);g.fill()}
   g.restore();
  });
 }
}
function dSand(g,R){
 for(let k=0;k<14;k++){
  const y=k*TH/14+R()*20,h=8+R()*26,ph=R()*6,col=k%2?'rgba(255,230,170,.16)':'rgba(80,50,20,.2)';
  tri(dy=>{
   g.beginPath();
   for(let x=0;x<=W;x+=20)g.lineTo(x,y+dy+Math.sin(x*.025+ph)*5);
   for(let x=W;x>=0;x-=20)g.lineTo(x,y+dy+h+Math.sin(x*.02+ph*1.7)*5);
   g.closePath();g.fillStyle=col;g.fill();
  });
 }
 for(let k=0;k<40;k++){
  const x=R()*W,y=R()*TH,r=1.5+R()*3;
  tri(dy=>{g.fillStyle='rgba(120,90,50,.5)';g.beginPath();g.ellipse(x,y+dy,r,r*.7,0,0,7);g.fill()});
 }
}
function dGranite(g,R){
 const fc=['#c9a8a0','#e8e6e2','#2a2a2e'];
 for(let k=0;k<70;k++){
  const x=R()*W,y=R()*TH,r=2+R()*5,c=fc[(R()*3)|0],a=R()*3;
  tri(dy=>{g.fillStyle=c;g.globalAlpha=.55;g.beginPath();g.ellipse(x,y+dy,r,r*.7,a,0,7);g.fill();g.globalAlpha=1});
 }
 for(let k=0;k<12;k++){
  const p=walk(R,R()*W,R()*TH,.6+R()*1.6,9,16,1.2),w=1+R()*1.6;
  tri(dy=>{wob(g,p,dy,'rgba(0,0,0,.35)',w+2);wob(g,p,dy,'#e8dcc8',w)});
 }
 for(let k=0;k<8;k++){
  const x=R()*W,y=R()*TH;
  tri(dy=>{g.fillStyle='rgba(255,215,90,.9)';g.beginPath();g.arc(x,y+dy,1.6,0,7);g.fill()});
 }
}
function dCave(g,R){
 for(let k=0;k<18;k++){
  const x=R()*W,y=R()*TH,L=60+R()*140,w=1.5+R()*2,ph=R()*6,pts=[];
  for(let j=0;j<=8;j++)pts.push([x+Math.sin(j*.8+ph)*3,y+j*L/8]);
  tri(dy=>wob(g,pts,dy,'rgba(150,200,230,.14)',w));
 }
 for(let k=0;k<8;k++){
  const y=R()*TH,ph=R()*6,pts=[],ds=[];
  for(let x=0;x<=W;x+=20)pts.push([x,y+Math.sin(x*.04+ph)*4]);
  for(let j=0;j<6;j++)ds.push([R()*W,6+R()*12,8+R()*20]);
  tri(dy=>{
   wob(g,pts,dy,'rgba(0,0,0,.4)',5);wob(g,pts,dy+3,'rgba(120,160,200,.16)',1.5);
   g.fillStyle='rgba(10,14,24,.6)';
   for(const d of ds){g.beginPath();g.moveTo(d[0]-d[1]/2,y+dy+4);g.lineTo(d[0]+d[1]/2,y+dy+4);g.lineTo(d[0],y+dy+4+d[2]);g.closePath();g.fill()}
  });
 }
 for(let k=0;k<14;k++){
  const x=R()*W,y=R()*TH,r=2+R()*2;
  tri(dy=>{
   const gr=g.createRadialGradient(x,y+dy,1,x,y+dy,16);gr.addColorStop(0,'rgba(110,255,220,.4)');gr.addColorStop(1,'rgba(110,255,220,0)');
   g.fillStyle=gr;g.fillRect(x-16,y+dy-16,32,32);
   g.fillStyle='#9ffff0';g.beginPath();g.ellipse(x,y+dy,r*1.3,r*.8,0,Math.PI,0);g.fill();
   g.fillStyle='#4fd8b8';g.fillRect(x-.6,y+dy,1.2,r*1.6);
  });
 }
}
function dCrystal(g,R){
 const pal=[['#c9a0ff','#5a2fb0'],['#8fb6ff','#2a3fa0'],['#ff9ad6','#8a2a7a']];
 for(let k=0;k<16;k++){
  const x=R()*W,y=R()*TH,pl=pal[(R()*3)|0],n=3+((R()*4)|0),pr=[];
  for(let j=0;j<n;j++)pr.push([(R()-.5)*1.6,14+R()*36,6+R()*8]);
  tri(dy=>{
   const gr=g.createRadialGradient(x,y+dy,2,x,y+dy,46);gr.addColorStop(0,'rgba(170,120,255,.3)');gr.addColorStop(1,'rgba(170,120,255,0)');
   g.fillStyle=gr;g.fillRect(x-46,y+dy-46,92,92);
   for(const p of pr){
    const a=p[0],L=p[1],w=p[2],tx=x+Math.sin(a)*L,ty=y+dy-Math.cos(a)*L,nx=Math.cos(a)*w/2,ny=Math.sin(a)*w/2;
    g.beginPath();g.moveTo(x-nx,y+dy-ny);g.lineTo(x+nx,y+dy+ny);g.lineTo(tx+nx*.35,ty+ny*.35);g.lineTo(tx,ty-3);g.lineTo(tx-nx*.35,ty-ny*.35);g.closePath();
    const gg=g.createLinearGradient(x-nx,y+dy,x+nx,y+dy);gg.addColorStop(0,pl[0]);gg.addColorStop(1,pl[1]);
    g.fillStyle=gg;g.fill();g.strokeStyle='rgba(20,10,50,.6)';g.lineWidth=1;g.stroke();
    g.beginPath();g.moveTo(x-nx,y+dy-ny);g.lineTo(tx-nx*.35,ty-ny*.35);g.lineTo(tx,ty-3);g.lineTo(x,y+dy);g.closePath();
    g.fillStyle='rgba(255,255,255,.3)';g.fill();
   }
  });
 }
}

function biomeAt(d){let i=0;while(i<BI.length-1&&d>=BI[i+1].start)i++;return i}
function bakeTile(i){
 const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(W*TS));c.height=Math.ceil(TH*TS);
 const g=c.getContext('2d');g.scale(TS,TS);
 const R=rngf(1000+i*7919),B=BI[i];
 g.fillStyle=B.base;g.fillRect(0,0,W,TH);
 for(let k=0;k<26;k++){g.fillStyle=R()<.5?'rgba(0,0,0,.10)':'rgba(255,255,255,.05)';g.beginPath();g.ellipse(R()*W,R()*TH,20+R()*50,12+R()*30,R()*3,0,7);g.fill()}
 for(let k=0;k<1400;k++){g.fillStyle=R()<.55?'rgba(0,0,0,'+R()*.2+')':'rgba(255,255,255,'+R()*.1+')';const sz=.5+R()*2.5;g.fillRect(R()*W,R()*TH,sz,sz)}

function tileOf(i){

  for(const k in tiles)if(Math.abs(k-i)>1)delete tiles[k];
  tiles[i]=bakeTile(i);

}
function wallStrip(i,y,h,surf,alpha){
 const t=tileOf(i);
 let sy=((y-surf)%TH+TH)%TH,rem=h,dy=y;
 ctx.globalAlpha=alpha;
 while(rem>0){
  const hh2=Math.min(rem,TH-sy);
  ctx.drawImage(t,0,sy*TS,t.width,hh2*TS,0,dy,W,hh2);
  dy+=hh2;rem-=hh2;sy=0;
 }
 ctx.globalAlpha=1;
}
function updAmb(dt,bi){
 for(const p of AMB){
  if(bi>=6){p.y-=dt*(.05+.12*p.s)}
  else if(bi===4){p.y-=dt*.02*(1+p.s);p.x+=Math.sin(time+p.ph)*dt*.01}
  else if(bi===5){}
  else{p.y+=dt*.015*(1+p.s);p.x+=dt*.01*(p.s-.5)}
  if(p.y<-.02){p.y=1.02;p.x=Math.random()}
  if(p.y>1.02){p.y=-.02;p.x=Math.random()}
  if(p.x<-.02)p.x=1.02;if(p.x>1.02)p.x=-.02;
 }
}

 }
}

function pick(d){
 if(Math.random()<.02)d*=rnd(2.5,6);
 let tot=FILLW;const ws=[];
 for(const m of M){
  let w=0;
  if(d>=m.min){
   const fi=Math.max(20,Math.min(m.max-m.min,m.min*.5+40)*.25);
   w=d<m.min+fi?(d-m.min)/fi:d<=m.max?1:Math.max(.05,1-(d-m.max)/(m.max*.6+50));
   w*=m.w;
  }
  ws.push(w);tot+=w;
 }
 let r=Math.random()*tot;
 if(r<FILLW)return null;
 r-=FILLW;
 for(let i=0;i<M.length;i++){r-=ws[i];if(r<=0)return M[i]}
 return null;
}
function fillerName(d){return d<40?'Soil':d<120?'Clay':d<300?'Sandstone':d<700?'Granite':d<1500?'Basalt':d<3000?'Obsidian':d<5000?'Magma rock':'Core rock'}
function makeBlock(r,force){
 const dm=(r+1)*3,m=force||pick(dm);let t;
 if(m){
  t={id:m.id,name:m.name,kind:m.kind,c1:m.c1,c2:m.c2,col:m.col,live:!!LIVE[m.kind],time:m.time*rnd(.85,1.15),val:Math.round(m.val*rnd(.75,1.25)),fl:0,jp:0};
  if(m.id==='chest'){t.val=Math.round(m.val*rnd(.5,6));t.jp=t.val>m.val*2.5?1:0}
  else if(Math.random()<.02){t.fl=1;t.val*=3;t.time*=1.2}
 }else t={id:'rock',name:fillerName(dm),kind:'rock',col:'#ffd9a0',time:(1+Math.min(1.5,dm/2000))*rnd(.9,1.1),val:1+Math.floor(dm/60),fl:0,jp:0,live:false};
 const b={t,prog:0,c:strata(dm),seed:Math.random(),n:4+(Math.random()<.5?1:0),shake:0,flash:0,pb:[],cr:[],ore:[]};
 for(let i=0;i<7;i++)b.pb.push({x:Math.random(),y:Math.random(),r:rnd(.03,.09),l:Math.random()<.4});
 for(let i=0;i<4;i++){
  let x=.5+rnd(-.1,.1),y=.5+rnd(-.1,.1),a=rnd(0,6.28);const pl=[[x,y]];
  for(let k=0;k<3;k++){a+=rnd(-.8,.8);x+=Math.cos(a)*rnd(.1,.2);y+=Math.sin(a)*rnd(.1,.2);pl.push([x,y])}
  b.cr.push(pl);
 }
 for(let i=0;i<5;i++)b.ore.push({x:rnd(.22,.78),y:rnd(.25,.78),r:rnd(.07,.12),a:rnd(0,3)});
 return b;
}

function update(dt){
 time+=dt;
 scrollOff*=Math.exp(-dt*12);if(scrollOff<.3)scrollOff=0;
 const want=holding&&started;
 if(mode==='up'){vp=Math.min(1,vp+dt/2);if(vp>=1){vp=1;mode='surf'}}
 else if(mode==='down'){vp=Math.max(0,vp-dt/2);if(vp<=0){vp=0;mode='dig'}}
 vpE=vp*vp*(3-2*vp);
 const dn=started&&mode==='dig';
 eng+=(dn?dt/.32:-dt/.28);eng=Math.max(0,Math.min(1,eng));
 drilling=want&&dn&&eng>=1&&scrollOff<step*.2;
 if(drilling){
  const b=blocks[0];
  b.prog+=dt*Math.min(power()/b.t.time,1/.15);
  fxT+=dt;if(fxT>.09){fxT=0;fx()}
  phase+=dt*170*Math.min(4,1+.25*(lvl-1));
  dustT+=dt;if(dustT>.07){dustT=0;addDust(cx,tipY+3+scrollOff)}
  if(b.prog>=1)breakBlock(b,tipY+3+scrollOff);
 }
 for(let i=0;i<blocks.length&&i<10;i++){const b=blocks[i];b.shake*=Math.exp(-dt*14);b.flash*=Math.exp(-dt*12)}
 let n=0;
 for(let i=0;i<parts.length;i++){const p=parts[i];p.life-=dt;if(p.life<=0)continue;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='dust')p.s+=dt*8;parts[n++]=p}
 parts.length=n;if(n>220)parts.splice(0,n-220);
 n=0;
 for(let i=0;i<floats.length;i++){const f=floats[i];f.life-=dt;if(f.life<=0)continue;f.y-=dt*55;floats[n++]=f}
 floats.length=n;
 curBi=biomeAt((row+1)*3*(1-vpE));updAmb(dt,curBi);
 disp+=(money-disp)*Math.min(1,dt*9);if(Math.abs(money-disp)<.5)disp=money;
}

function drawSky(surf){

 ctx.fillStyle=g;ctx.fillRect(0,0,W,surf);
 const sx=W*.8,sy=Math.max(40,surf*.38);
 const sg=ctx.createRadialGradient(sx,sy,4,sx,sy,70);sg.addColorStop(0,'rgba(255,248,215,1)');sg.addColorStop(.25,'rgba(255,240,190,.8)');sg.addColorStop(1,'rgba(255,230,170,0)');
 ctx.fillStyle=sg;ctx.fillRect(sx-80,sy-80,160,160);
 ctx.fillStyle='rgba(255,255,255,.75)';
 for(let i=0;i<3;i++){const x=((time*7+i*170)%(W+240))-120,y=surf*(.2+.18*i);ctx.beginPath();ctx.ellipse(x,y,40,11,0,0,7);ctx.ellipse(x+22,y-7,26,10,0,0,7);ctx.ellipse(x-22,y-4,24,9,0,0,7);ctx.fill()}
 ctx.fillStyle='#7f9a82';ctx.beginPath();ctx.moveTo(0,surf);
 for(let x=0;x<=W;x+=16)ctx.lineTo(x,surf-26-Math.sin(x*.012+1)*16-Math.sin(x*.03)*6);
 ctx.lineTo(W,surf);ctx.closePath();ctx.fill();
 ctx.fillStyle='#5e8a42';ctx.beginPath();ctx.moveTo(0,surf);
 for(let x=0;x<=W;x+=16)ctx.lineTo(x,surf-10-Math.sin(x*.02+3)*6);

 ctx.fillStyle='#4a7a30';ctx.fillRect(0,surf-3,W,7);

function drawBG(){

  const h=Math.min(32,H-y);
  if(y+h<=surf)continue;
  const d=dS(y+h/2),i=biomeAt(d);
  wallStrip(i,y,h,surf,1);
  if(i<BI.length-1){const S=BI[i+1].start,fl=Math.min(60,S*.5);if(d>S-fl)wallStrip(i+1,y,h,surf,(d-(S-fl))/fl)}
 }
 drawAmb(surf);
 if(surf>0)drawSky(surf);
 const x0=cx-shaftW/2,cy=Math.max(surf,-10);
 const sh=ctx.createLinearGradient(x0-16,0,x0+shaftW+16,0);
 sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(16/(shaftW+32),'rgba(0,0,0,.4)');sh.addColorStop(1-16/(shaftW+32),'rgba(0,0,0,.4)');sh.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=sh;ctx.fillRect(x0-16,cy,shaftW+32,H-cy);

 }
}

   ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(bx,by,bw*Math.min(1,b.prog),2);
  }
 }
}

function metalH(x0,x1,y,stops){const g=ctx.createLinearGradient(x0,y,x1,y);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function drawRig(){
 const sx=drilling?Math.sin(time*80)*1.3:0,sy=drilling?Math.cos(time*97)*.7:0;
 const X=cx+sx,R=tipY-rigY0,e=eng*eng*(3-2*eng);
 const bw=bs*1.9,bx=X-bw/2,by=rigY0;
 let g=ctx.createLinearGradient(0,by,0,by+16);g.addColorStop(0,'#b4bac1');g.addColorStop(.5,'#6d737a');g.addColorStop(1,'#3b3f44');
 rrect(bx,by,bw,16,4);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#15171a';ctx.lineWidth=1.2;ctx.stroke();
 for(const ex of [bx-6,bx+bw-14]){
  ctx.save();rrect(ex,by-4,20,24,4);ctx.fillStyle='#e6a800';ctx.fill();ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=4;
  for(let k=-2;k<4;k++){ctx.beginPath();ctx.moveTo(ex+k*8,by+20);ctx.lineTo(ex+k*8+16,by-4);ctx.stroke()}
  ctx.restore();rrect(ex,by-4,20,24,4);ctx.strokeStyle='#15171a';ctx.lineWidth=1.2;ctx.stroke();
 }
 const ch=R*.08,cylB=by+16+ch;
 const mh=R*.2,chh=R*.05,bitH=R*.25;
 const mYe=rigY0+R*.5,mYr=cylB+8;
 const mY=mYr+(mYe-mYr)*e+sy;
 ctx.fillStyle=metalH(X-4.5,X+4.5,0,[[0,'#6a7076'],[.45,'#f0f3f5'],[1,'#50555b']]);
 ctx.fillRect(X-4.5,by+16,9,mY-(by+16)+4);
 rrect(X-11,by+16,22,ch,3);ctx.fillStyle=metalH(X-11,X+11,0,[[0,'#3b4046'],[.4,'#aeb4ba'],[1,'#3b4046']]);ctx.fill();ctx.strokeStyle='#15171a';ctx.lineWidth=1.2;ctx.stroke();
 const mw=bs*.68;
 rrect(X-mw/2,mY,mw,mh,7);ctx.fillStyle=metalH(X-mw/2,X+mw/2,0,[[0,'#3f4449'],[.3,'#9aa1a8'],[.55,'#d3d8dc'],[1,'#454a50']]);ctx.fill();
 ctx.strokeStyle='#14161a';ctx.lineWidth=1.3;ctx.stroke();
 for(let yy=mY+mh*.62;yy<mY+mh-5;yy+=5){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(X-mw/2+3,yy,mw-6,2);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(X-mw/2+3,yy+2,mw-6,1)}
 const bandH=Math.max(7,mh*.2),bandY=mY+mh*.32;
 ctx.fillStyle=BAND[Math.floor((lvl-1)/3)%BAND.length];ctx.fillRect(X-mw/2+1,bandY,mw-2,bandH);
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(X-mw/2+1,bandY+bandH*.55,mw-2,bandH*.45);
 ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(X-mw/2+1,bandY,mw-2,1.5);
 ctx.save();const lc=drilling?'#ffb020':'#38e07a';ctx.shadowColor=lc;ctx.shadowBlur=9;
 ctx.fillStyle=lc;ctx.beginPath();ctx.arc(X,mY+mh*.14,3.5,0,7);ctx.fill();ctx.restore();
 const cy0=mY+mh,cw=mw*.62;
 ctx.beginPath();ctx.moveTo(X-cw/2,cy0);ctx.lineTo(X+cw/2,cy0);ctx.lineTo(X+cw*.36,cy0+chh);ctx.lineTo(X-cw*.36,cy0+chh);ctx.closePath();
 ctx.fillStyle=metalH(X-cw/2,X+cw/2,0,[[0,'#1d2023'],[.5,'#5b6167'],[1,'#1d2023']]);ctx.fill();ctx.strokeStyle='#0b0c0e';ctx.stroke();
 const y0=cy0+chh,w0=bs*.46,tipN=y0+bitH;
 ctx.save();ctx.beginPath();
 ctx.moveTo(X-w0/2,y0);ctx.lineTo(X+w0/2,y0);ctx.lineTo(X,tipN);ctx.closePath();
 ctx.fillStyle=metalH(X-w0/2,X+w0/2,0,[[0,'#6b7279'],[.4,'#f2f5f7'],[1,'#596067']]);ctx.fill();
 ctx.clip();
 for(let i=-1;i<9;i++){
  const yy=y0+((i*bitH/6+phase)%(bitH+bitH/6))-bitH/12;
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X-w0/2,yy);ctx.lineTo(X+w0/2,yy+9);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(X-w0/2,yy+3);ctx.lineTo(X+w0/2,yy+12);ctx.stroke();
 }
 ctx.restore();
 ctx.beginPath();ctx.moveTo(X-w0/2,y0);ctx.lineTo(X,tipN);ctx.lineTo(X+w0/2,y0);
 ctx.strokeStyle='#14161a';ctx.lineWidth=1.2;ctx.stroke();
}

function drawFX(){
 for(const p of parts){
  const a=Math.max(0,Math.min(1,p.life/p.max));
  if(p.k==='spark'){
   ctx.strokeStyle=p.col;ctx.globalAlpha=a;ctx.lineWidth=p.s;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();
  }else if(p.k==='chip'){
   ctx.fillStyle=p.col;ctx.globalAlpha=Math.min(1,a*1.6);ctx.fillRect(p.x,p.y,p.s,p.s*.8);
  }else{
   ctx.fillStyle='rgba('+p.col+','+(a*.35)+')';ctx.globalAlpha=1;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();
  }
 }
 ctx.globalAlpha=1;ctx.lineCap='butt';
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const f of floats){
  const a=Math.min(1,f.life/f.max*1.8);
  ctx.globalAlpha=a;ctx.font=(f.big&&f.t.length<27?'800 20px':'800 16px')+' system-ui,sans-serif';
  ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(f.t,f.x,f.y);
  ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y);
 }
 ctx.globalAlpha=1;
}

function draw(){
 drawBG();
 drawBlocks();
 if(eng>.02){
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.24*eng;
  ctx.drawImage(glowCv,cx-bs*2,tipY-bs*1.5,bs*4,bs*4);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 }
 drawRig();
 drawFX();
 const depthM=(row+1)*3*(1-vpE);
 ctx.globalAlpha=.38+Math.min(.32,depthM/800);
 ctx.drawImage(vigCv,0,0,W,H);
 ctx.globalAlpha=1;
}

const dEl=$('depth'),mEl=$('money'),lvEl=$('lv'),hEl=$('hint');
let lD='',lM='',lL='',lH=null,lU='',lT='',lS='';
function hud(){
 const d=fmtD(Math.round((row+1)*3*(1-vpE)));if(d!==lD){dEl.textContent=d;lD=d}
 const m='$'+fm(disp);if(m!==lM){mEl.textContent=m;lM=m}
 const l='LV '+lvl;if(l!==lL){lvEl.textContent=l;lL=l}
 const u=money>=UCOST?'ready':'dis';if(u!==lU){upEl.className=u;lU=u}
 const idle=mode==='dig'||mode==='surf';
 const ht=mode==='surf'?'HOLD TO GO DOWN':'HOLD TO DRILL';if(ht!==lT){hEl.textContent=ht;lT=ht}
 const sm=started&&idle?mode:'x';
 if(sm!==lS){lS=sm;const sb=$('surf');sb.classList.toggle('off',sm==='x');sb.classList.toggle('down',sm==='surf');$('surfT').textContent=sm==='surf'?'GO DOWN':'SURFACE'}
 const showHint=started&&!holding&&idle;
 if(showHint!==lH){hEl.classList.toggle('off',!showHint);lH=showHint}
}

function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 update(dt);draw();hud();
 requestAnimationFrame(frame);
}
requestAnimationFrame(ts=>{last=ts;frame(ts)});
})();
</script>
