<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Deep Drill</title>
<style>
html,body{margin:0;height:100%;background:#14110f;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eee}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none;z-index:3}
.row{display:flex;gap:8px}
.panel{flex:1;min-width:0;border-radius:12px;padding:7px 10px 8px;background:linear-gradient(#2d2925,#1a1714);border:1px solid #4d453d;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 5px 14px rgba(0,0,0,.55)}
.lbl{display:block;font-size:10px;letter-spacing:.18em;color:#a79b8d;font-weight:700}
.lcd,.val{display:block;margin-top:3px;padding:2px 7px;border-radius:6px;box-shadow:inset 0 2px 5px #000;font:700 20px ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.lcd{background:#07110b;color:#7dffb2;text-shadow:0 0 8px rgba(125,255,178,.65)}
.val{background:#140f05;color:#ffd45a;text-shadow:0 0 8px rgba(255,200,60,.55)}
#up{flex:none;width:82px;padding:0;border:2px solid #1b5a28;border-radius:8px;background:linear-gradient(135deg,#86d894,#2f8a43 55%,#52b064);box-shadow:0 3px 0 #123d1b,0 6px 12px rgba(0,0,0,.5);pointer-events:auto;color:#0f3d1a;letter-spacing:0;cursor:pointer;transform:rotate(2deg);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:system-ui,sans-serif}
#up::before{content:"";position:absolute;inset:3px;border:1px dashed rgba(15,61,26,.55);border-radius:5px;pointer-events:none}
#up .amt{font-size:21px;font-weight:900}
#up .sub{font-size:9px;font-weight:800;letter-spacing:.14em}
#up .lv{font-size:10px;font-weight:800;background:#0f3d1a;color:#b6ffc3;border-radius:6px;padding:1px 6px;margin-top:1px}
#up.dis{filter:grayscale(.9) brightness(.65)}
#up.ready{animation:glow 1.2s infinite}
#up:active{transform:rotate(2deg) translateY(2px);box-shadow:0 1px 0 #123d1b}
@keyframes glow{50%{box-shadow:0 3px 0 #123d1b,0 0 0 6px rgba(120,255,150,.28),0 6px 12px rgba(0,0,0,.5)}}
#surf{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:3;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:linear-gradient(#ffc24a,#e8820c);box-shadow:0 4px 0 #8a4a00,0 8px 16px rgba(0,0,0,.55);color:#2a1600;font:800 9px system-ui,sans-serif;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
#surf svg{width:22px;height:22px;transition:transform .2s}
#surf.down svg{transform:rotate(180deg)}
#surf:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4a00}
#surf.off{display:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,6,.76);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
.ov.hide{display:none}
.card{width:min(84vw,340px);text-align:center;padding:24px 22px;border-radius:18px;background:linear-gradient(#2f2a25,#1a1714);border:1px solid #574d43;box-shadow:0 14px 40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1)}
.card h1{margin:0 0 10px;font-size:32px;letter-spacing:.14em;color:#ffd45a;text-shadow:0 2px 0 #7a4b00,0 0 18px rgba(255,190,50,.45)}
.card p{margin:0 0 18px;font-size:15px;line-height:1.5;color:#cfc5b9}
#go{font:800 17px system-ui,sans-serif;letter-spacing:.04em;color:#2a1600;border:0;border-radius:12px;padding:14px 26px;background:linear-gradient(#ffc24a,#e8820c);box-shadow:0 4px 0 #8a4a00,0 8px 16px rgba(0,0,0,.5);cursor:pointer}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4a00}
#reset{display:block;margin-top:16px;font-size:12px;color:#8d8275;text-decoration:underline;cursor:pointer}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);z-index:2;padding:12px 22px;border-radius:30px;font:800 14px system-ui,sans-serif;letter-spacing:.2em;color:#ffe9b0;background:rgba(20,15,10,.7);border:1px solid rgba(255,200,90,.5);pointer-events:none;transition:opacity .25s;animation:pulse 1.4s infinite;white-space:nowrap}
#hint.off{opacity:0}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,190,70,.12)}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <div class="panel"><span class="lbl">DEPTH</span><span class="lcd" id="depth">-10 ft</span></div>
    <div class="panel"><span class="lbl">CASH</span><span class="val" id="money">$0</span></div>
    <button id="up" class="dis" aria-label="Upgrade drill for 100 dollars"><span class="amt">$100</span><span class="sub">UPGRADE</span><span class="lv" id="lv">LV 1</span></button>
  </div>
</div>

<button id="surf" class="off" aria-label="Go to surface"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5 12l7-7 7 7"/></svg><span id="surfT">SURFACE</span></button>

<div id="hint" class="off">HOLD TO DRILL</div>

<div id="start" class="ov">
  <div class="card">
    <h1>DEEP DRILL</h1>
    <p>Hold anywhere to lower the drill and dig.<br>Tap SURFACE to ride back up to the grass.<br>Tap the $100 note to upgrade the drill.</p>
    <button id="go">Start drilling</button>
    <a id="reset">Reset progress</a>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game');
let ctx=cv.getContext('2d',{alpha:false});

const T=[
 {id:'stone',  name:'Rock',     time:1.0,val:1,  min:0,  w:60},
 {id:'copper', name:'Copper',   time:1.5,val:3,  min:0,  w:14},
 {id:'silver', name:'Silver',   time:2.0,val:8,  min:40, w:10},
 {id:'quartz', name:'Quartz',   time:2.0,val:12, min:60, w:8},
 {id:'gold',   name:'Gold',     time:2.6,val:25, min:120,w:7},
 {id:'ruby',   name:'Ruby',     time:3.2,val:50, min:200,w:5},
 {id:'emerald',name:'Emerald',  time:3.4,val:70, min:260,w:4},
 {id:'diamond',name:'Diamond',  time:4.2,val:150,min:350,w:3},
 {id:'star',   name:'Starstone',time:5.5,val:400,min:600,w:2}
];
const ST=[[0,[112,80,52]],[120,[128,96,70]],[300,[96,98,104]],[500,[66,68,78]],[800,[46,40,52]],[1200,[78,36,32]]];
const COL={stone:'#ffd9a0',copper:'#f0a068',silver:'#e8eef3',quartz:'#dfe6ff',gold:'#ffd24a',ruby:'#ff4a6a',emerald:'#3fe090',diamond:'#9ff0ff',star:'#c58bff'};
const BAND=['#ff8a3c','#ffd23c','#4cd6ff','#b36bff'];
const UCOST=100,MAXL=10;
const KEY='deepdrill.v2';

let W=0,H=0,DPR=1,bs=60,step=64,shaftW=90,cx=0,tipY=0,rigY0=0,hudH=80;
let money=0,row=0,lvl=1,started=false,holding=false;
let mode='surf',vp=1,vpE=1,eng=0,time=0,scrollOff=0,phase=0,disp=0,last=0,dustT=0,fxT=0,drilling=false;
let blocks=[],parts=[],floats=[];

try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){money=s.money|0;row=s.row|0;lvl=Math.min(MAXL,Math.max(1,s.lvl|0||1))}}catch(e){}
disp=money;
function save(){try{localStorage.setItem(KEY,JSON.stringify({money,row,lvl}))}catch(e){}}
const power=()=>1+.4*(lvl-1);

const hh=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const rnd=(a,b)=>a+Math.random()*(b-a);
const rgb=(c,k=1,a=1)=>{let r=c[0],g=c[1],b=c[2];if(k<1){r*=k;g*=k;b*=k}else if(k>1){const m=k-1;r+=(255-r)*m;g+=(255-g)*m;b+=(255-b)*m}return 'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+a+')'};
function strata(d){
 d=Math.max(0,d);let i=0;
 while(i<ST.length-2&&d>ST[i+1][0])i++;
 const a=ST[i],b=ST[i+1],t=Math.min(1,Math.max(0,(d-a[0])/(b[0]-a[0])));
 return [a[1][0]+(b[1][0]-a[1][0])*t,a[1][1]+(b[1][1]-a[1][1])*t,a[1][2]+(b[1][2]-a[1][2])*t];
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

const tile=document.createElement('canvas');tile.width=tile.height=256;
(()=>{
 const tc=tile.getContext('2d');
 for(let i=0;i<1100;i++){
  tc.fillStyle=Math.random()<.55?'rgba(0,0,0,'+(Math.random()*.2)+')':'rgba(255,255,255,'+(Math.random()*.1)+')';
  const s=Math.random()*3+.5;tc.fillRect(Math.random()*256,Math.random()*256,s,s);
 }
 for(let i=0;i<46;i++){
  tc.fillStyle=Math.random()<.6?'rgba(0,0,0,.14)':'rgba(255,255,255,.07)';
  tc.beginPath();tc.ellipse(Math.random()*256,Math.random()*256,rnd(2,7),rnd(1.5,5),Math.random()*3,0,7);tc.fill();
 }
})();

function pick(d){
 let tot=0;
 const ws=T.map(t=>{
  let w;
  if(t.id==='stone')w=60-Math.min(25,d/30);
  else if(d<t.min)w=0;
  else w=t.w*Math.min(1,(d-t.min)/200+.25);
  tot+=w;return w;
 });
 let r=Math.random()*tot;
 for(let i=0;i<T.length;i++){r-=ws[i];if(r<=0)return T[i]}
 return T[0];
}
function makeBlock(r){
 const d=(r+1)*10,t=pick(d);
 const b={t,prog:0,c:strata(d),seed:Math.random(),shake:0,flash:0,pb:[],cr:[],ore:[]};
 for(let i=0;i<7;i++)b.pb.push({x:Math.random(),y:Math.random(),r:rnd(.03,.09),l:Math.random()<.4});
 for(let i=0;i<4;i++){
  let x=.5+rnd(-.1,.1),y=.5+rnd(-.1,.1),a=rnd(0,6.28);const pl=[[x,y]];
  for(let k=0;k<3;k++){a+=rnd(-.8,.8);x+=Math.cos(a)*rnd(.1,.2);y+=Math.sin(a)*rnd(.1,.2);pl.push([x,y])}
  b.cr.push(pl);
 }
 const n=t.id==='stone'?0:(t.id==='quartz'?4:rnd(0,1)<.5?4:5);
 for(let i=0;i<n;i++)b.ore.push({x:rnd(.22,.78),y:rnd(.25,.78),r:rnd(.07,.12),a:rnd(0,3)});
 return b;
}
function ensure(){while(blocks.length<14)blocks.push(makeBlock(row+blocks.length))}
ensure();

let cacheKey=0,vigCv=null,glowCv=null;
function buildSprites(){
 vigCv=document.createElement('canvas');vigCv.width=Math.ceil(W*DPR);vigCv.height=Math.ceil(H*DPR);
 let c=vigCv.getContext('2d');c.scale(DPR,DPR);
 let g=c.createRadialGradient(cx,H*.45,H*.22,cx,H*.45,H*.85);
 g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');
 c.fillStyle=g;c.fillRect(0,0,W,H);
 const sz=Math.ceil(bs*4);
 glowCv=document.createElement('canvas');glowCv.width=Math.ceil(sz*DPR);glowCv.height=Math.ceil(sz*DPR);
 c=glowCv.getContext('2d');c.scale(DPR,DPR);
 g=c.createRadialGradient(bs*2,bs*1.5+10,4,bs*2,bs*1.5+10,bs*1.9);
 g.addColorStop(0,'rgba(255,190,100,1)');g.addColorStop(1,'rgba(255,190,100,0)');
 c.fillStyle=g;c.fillRect(0,0,sz,sz);
}
function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 bs=Math.max(44,Math.min(W*.3,H*.13,104));step=bs+4;shaftW=bs+26;cx=W/2;
 hudH=$('hud').getBoundingClientRect().height;
 const R=Math.max(170,Math.min(H*.3,260));
 rigY0=hudH+8;tipY=rigY0+R;
 cacheKey++;buildSprites();
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();

function addSparks(n,x,y,col){
 for(let i=0;i<n;i++)parts.push({k:'spark',x:x+rnd(-8,8),y,vx:rnd(-190,190),vy:rnd(-300,-40),g:700,life:rnd(.2,.45),max:.45,col,s:2});
}
function addChips(n,x,y,c,spd){
 for(let i=0;i<n;i++)parts.push({k:'chip',x:x+rnd(-12,12),y:y+rnd(-4,4),vx:rnd(-spd,spd),vy:rnd(-spd*1.2,-spd*.1),g:900,life:rnd(.4,.8),max:.8,col:rgb(c,rnd(.7,1.3)),s:rnd(2.5,6)});
}
function addDust(x,y){
 parts.push({k:'dust',x:x+rnd(-14,14),y:y-2,vx:rnd(-30,30),vy:rnd(-50,-15),g:0,life:rnd(.5,.9),max:.9,col:'180,165,148',s:rnd(4,9)});
}
function addFloat(x,y,text,col,big){floats.push({x,y,t:text,c:col,life:1.1,max:1.1,big})}

function fx(){
 const b=blocks[0],t=b.t,y=tipY+3+scrollOff;
 b.shake=1;b.flash=.3;
 addSparks(t.id==='stone'?2:4,cx,y,t.id==='stone'?'#ffd9a0':'#fff0b0');
 addChips(2,cx,y,b.c,150);
}
function breakBlock(b,y){
 const t=b.t;
 money+=t.val;
 addChips(18,cx,y+bs*.3,b.c,320);
 if(t.id!=='stone'){
  for(let i=0;i<12;i++)parts.push({k:'spark',x:cx+rnd(-14,14),y:y+bs*.3,vx:rnd(-240,240),vy:rnd(-340,-60),g:600,life:rnd(.4,.8),max:.8,col:COL[t.id],s:2.6});
  addFloat(cx,y+bs*.1,t.name+'  +$'+t.val,COL[t.id],true);
  try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}
 }else addFloat(cx,y+bs*.1,'+$'+t.val,'#ffe9a8',false);
 blocks.shift();row++;scrollOff+=step;ensure();save();
}

const upEl=$('up');
upEl.addEventListener('click',()=>{
 if(!started||lvl>=MAXL||money<UCOST)return;
 money-=UCOST;lvl++;save();
 addFloat(cx,tipY-bs*.9,'Drill upgraded  LV '+lvl,'#9dffb0',true);
 for(let i=0;i<14;i++)parts.push({k:'spark',x:cx+rnd(-20,20),y:tipY-bs*.4,vx:rnd(-220,220),vy:rnd(-280,-40),g:600,life:rnd(.4,.8),max:.8,col:'#9dffb0',s:2.4});
 try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
});
$('go').addEventListener('click',()=>{started=true;$('start').classList.add('hide')});
$('surf').addEventListener('click',()=>{
 if(mode==='dig'){mode='up';holding=false}
 else if(mode==='surf')mode='down';
});
$('reset').addEventListener('click',()=>{
 if(confirm('Reset all progress?')){money=0;row=0;lvl=1;disp=0;blocks=[];parts=[];floats=[];scrollOff=0;ensure();save()}
});

function press(){if(!started||mode==='up')return;holding=true;if(mode==='surf')mode='down'}
function release(){holding=false}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}press()});
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('lostpointercapture',release);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',release);
document.addEventListener('visibilitychange',()=>{if(document.hidden){release();save()}});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)press()}});
addEventListener('keyup',e=>{if(e.code==='Space')release()});
setInterval(save,4000);

function update(dt){
 time+=dt;
 scrollOff*=Math.exp(-dt*12);if(scrollOff<.3)scrollOff=0;
 const want=holding&&started;
 if(mode==='up'){vp=Math.min(1,vp+dt/2);if(vp>=1){vp=1;mode='surf'}}
 else if(mode==='down'){vp=Math.max(0,vp-dt/2);if(vp<=0){vp=0;mode='dig'}}
 vpE=vp*vp*(3-2*vp);
 const dn=started&&mode==='dig';
 eng+=(dn?dt/.32:-dt/.28);eng=Math.max(0,Math.min(1,eng));
 drilling=want&&dn&&eng>=1&&scrollOff<step*.2;
 if(drilling){
  const b=blocks[0];
  b.prog+=dt*power()/b.t.time;
  fxT+=dt;if(fxT>.09){fxT=0;fx()}
  phase+=dt*170*(1+.25*(lvl-1));
  dustT+=dt;if(dustT>.07){dustT=0;addDust(cx,tipY+3+scrollOff)}
  if(b.prog>=1)breakBlock(b,tipY+3+scrollOff);
 }
 for(let i=0;i<blocks.length&&i<10;i++){const b=blocks[i];b.shake*=Math.exp(-dt*14);b.flash*=Math.exp(-dt*12)}
 let n=0;
 for(let i=0;i<parts.length;i++){const p=parts[i];p.life-=dt;if(p.life<=0)continue;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='dust')p.s+=dt*8;parts[n++]=p}
 parts.length=n;if(n>220)parts.splice(0,n-220);
 n=0;
 for(let i=0;i<floats.length;i++){const f=floats[i];f.life-=dt;if(f.life<=0)continue;f.y-=dt*55;floats[n++]=f}
 floats.length=n;
 disp+=(money-disp)*Math.min(1,dt*9);if(Math.abs(money-disp)<.5)disp=money;
}

function drawSky(surf){
 const g=ctx.createLinearGradient(0,0,0,surf);g.addColorStop(0,'#4f9fdc');g.addColorStop(1,'#f0dcb4');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,surf);
 const sx=W*.8,sy=Math.max(40,surf*.38);
 const sg=ctx.createRadialGradient(sx,sy,4,sx,sy,70);sg.addColorStop(0,'rgba(255,248,215,1)');sg.addColorStop(.25,'rgba(255,240,190,.8)');sg.addColorStop(1,'rgba(255,230,170,0)');
 ctx.fillStyle=sg;ctx.fillRect(sx-80,sy-80,160,160);
 ctx.fillStyle='rgba(255,255,255,.75)';
 for(let i=0;i<3;i++){const x=((time*7+i*170)%(W+240))-120,y=surf*(.2+.18*i);ctx.beginPath();ctx.ellipse(x,y,40,11,0,0,7);ctx.ellipse(x+22,y-7,26,10,0,0,7);ctx.ellipse(x-22,y-4,24,9,0,0,7);ctx.fill()}
 ctx.fillStyle='#7f9a82';ctx.beginPath();ctx.moveTo(0,surf);
 for(let x=0;x<=W;x+=16)ctx.lineTo(x,surf-26-Math.sin(x*.012+1)*16-Math.sin(x*.03)*6);
 ctx.lineTo(W,surf);ctx.closePath();ctx.fill();
 ctx.fillStyle='#5e8a42';ctx.beginPath();ctx.moveTo(0,surf);
 for(let x=0;x<=W;x+=16)ctx.lineTo(x,surf-10-Math.sin(x*.02+3)*6);
 ctx.lineTo(W,surf);ctx.closePath();ctx.fill();
 ctx.fillStyle='#4a7a30';ctx.fillRect(0,surf-3,W,7);
 ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(0,surf-3,W,1.5);
}

function drawBG(){
 const worldPx=(row*step-scrollOff)*(1-vpE),surf=tipY-2-worldPx;
 const dAt=y=>Math.max(0,(y-surf)/step*10);
 const g=ctx.createLinearGradient(0,0,0,H);
 for(let i=0;i<=8;i++)g.addColorStop(i/8,rgb(strata(dAt(H*i/8))));
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const off=((worldPx%256)+256)%256;
 for(let ty=-off;ty<H;ty+=256)for(let tx=0;tx<W;tx+=256)ctx.drawImage(tile,tx,ty);
 const i0=Math.max(1,Math.floor(-surf/150)),i1=Math.ceil((H-surf)/150);
 for(let i=i0;i<=i1;i++){
  const y=surf+i*150+hh(i)*50;
  ctx.beginPath();
  for(let x=0;x<=W;x+=20){const yy=y+Math.sin(x*.02+i)*6;if(x)ctx.lineTo(x,yy);else ctx.moveTo(x,yy)}
  ctx.strokeStyle='rgba(0,0,0,'+(.1+hh(i+9)*.1)+')';ctx.lineWidth=2+hh(i+3)*4;ctx.stroke();
 }
 if(surf>0)drawSky(surf);
 const x0=cx-shaftW/2,cy=Math.max(surf,-10);
 const sh=ctx.createLinearGradient(x0-16,0,x0+shaftW+16,0);
 sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(16/(shaftW+32),'rgba(0,0,0,.4)');sh.addColorStop(1-16/(shaftW+32),'rgba(0,0,0,.4)');sh.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=sh;ctx.fillRect(x0-16,cy,shaftW+32,H-cy);
 const cg=ctx.createLinearGradient(x0,0,x0+shaftW,0);
 cg.addColorStop(0,'#0a0807');cg.addColorStop(.5,'#1b1411');cg.addColorStop(1,'#0a0807');
 ctx.fillStyle=cg;ctx.fillRect(x0,cy,shaftW,H-cy);
 ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x0-1,cy,1.5,H-cy);ctx.fillRect(x0+shaftW-.5,cy,1.5,H-cy);
 const sp=step*3,j0=Math.max(1,Math.ceil((-12-surf)/sp));
 for(let y=surf+j0*sp;y<H;y+=sp){
  const bg=ctx.createLinearGradient(0,y,0,y+9);bg.addColorStop(0,'#6b6e75');bg.addColorStop(1,'#2c2d31');
  ctx.fillStyle=bg;ctx.fillRect(x0,y,shaftW,9);
  ctx.fillStyle='#9a9ea6';ctx.beginPath();ctx.arc(x0+5,y+4.5,1.8,0,7);ctx.arc(x0+shaftW-5,y+4.5,1.8,0,7);ctx.fill();
 }
}

const SHAPE={
 diamond:[[-1,-.3],[-.55,-.85],[.55,-.85],[1,-.3],[0,1]],
 ruby:[[0,-1],[.87,-.5],[.87,.5],[0,1],[-.87,.5],[-.87,-.5]],
 emerald:[[-.55,-1],[.55,-1],[1,-.55],[1,.55],[.55,1],[-.55,1],[-1,.55],[-1,-.55]]
};
function poly(pts,x,y,r){ctx.beginPath();pts.forEach((p,i)=>{const px=x+p[0]*r,py=y+p[1]*r;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py)});ctx.closePath()}
function gem(kind,x,y,r,c1,c2){
 const g=ctx.createLinearGradient(x-r,y-r,x+r,y+r);g.addColorStop(0,c1);g.addColorStop(1,c2);
 poly(SHAPE[kind],x,y,r);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=.8;
 if(kind==='diamond'){
  ctx.beginPath();ctx.moveTo(x-r,y-.3*r);ctx.lineTo(x+r,y-.3*r);
  ctx.moveTo(x-.55*r,y-.85*r);ctx.lineTo(x-.25*r,y-.3*r);ctx.lineTo(x,y+r);
  ctx.moveTo(x+.55*r,y-.85*r);ctx.lineTo(x+.25*r,y-.3*r);ctx.lineTo(x,y+r);ctx.stroke();
 }else{poly(SHAPE[kind],x,y,r*.55);ctx.stroke()}
 ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(x-r*.38,y-r*.4,r*.18,r*.1,-.6,0,7);ctx.fill();
}
function starGem(x,y,r,seed){
 const p=1+.1*Math.sin(time*4+seed*9);
 ctx.save();ctx.shadowColor='#b36bff';ctx.shadowBlur=14;
 ctx.beginPath();
 for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=(i%2?r*.38:r*1.15)*p;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py)}
 ctx.closePath();
 const g=ctx.createRadialGradient(x,y,1,x,y,r*1.2);g.addColorStop(0,'#fbeaff');g.addColorStop(1,'#8a3cff');
 ctx.fillStyle=g;ctx.fill();ctx.restore();
 ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.8;ctx.stroke();
}
function sparkle(x,y,r){
 ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=1.4;ctx.beginPath();
 ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();
}
function ore(b,x,y,s){
 const id=b.t.id;
 if(id==='stone')return;
 if(id==='copper'||id==='silver'||id==='gold'){
  const pal=id==='copper'?['#f4aa72','#a24e1c']:id==='silver'?['#f6f9fb','#8995a1']:['#ffe78a','#b07a0b'];
  for(const o of b.ore){
   const px=x+o.x*s,py=y+o.y*s,r=o.r*s*(id==='gold'?1.08:1);
   const g=ctx.createRadialGradient(px-r*.3,py-r*.3,r*.1,px,py,r);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);
   ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(px,py,r,r*.82,o.a,0,7);ctx.fill();
   ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=.8;ctx.stroke();
   ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(px-r*.35,py-r*.35,r*.2,0,7);ctx.fill();
  }
 }else if(id==='quartz'){
  for(const o of b.ore){
   const px=x+o.x*s,py=y+o.y*s+s*.05,r=o.r*s*.9;
   ctx.beginPath();ctx.moveTo(px-r*.6,py+r);ctx.lineTo(px-r*.2,py-r*1.4);ctx.lineTo(px+r*.5,py-r*.9);ctx.lineTo(px+r*.7,py+r);ctx.closePath();
   ctx.fillStyle='rgba(232,238,255,.88)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=.9;ctx.stroke();
   ctx.beginPath();ctx.moveTo(px-r*.2,py-r*1.4);ctx.lineTo(px,py+r);ctx.strokeStyle='rgba(150,170,230,.6)';ctx.stroke();
  }
 }else{
  const m=b.ore[0],gx=x+s*.5+(m.x-.5)*s*.18,gy=y+s*.45+(m.y-.5)*s*.18,gr=s*.24;
  const o1=b.ore[1],o2=b.ore[2];
  if(id==='star'){
   starGem(gx,gy,gr,b.seed);
   starGem(x+o1.x*s,y+o1.y*s*.8,s*.07,b.seed+1);
  }else{
   const pal=id==='ruby'?['#ff8aa0','#a3001f']:id==='emerald'?['#8dffc6','#00733f']:['#ffffff','#7fd9ee'];
   gem(id,gx,gy,gr,pal[0],pal[1]);
   gem(id,x+o1.x*s,y+o1.y*s*.8,s*.09,pal[0],pal[1]);
   gem(id,x+o2.x*s,y+o2.y*s*.8,s*.08,pal[0],pal[1]);
  }

 }
}
function twinkle(b,x,y,s){
 const id=b.t.id;
 if(id!=='ruby'&&id!=='emerald'&&id!=='diamond'&&id!=='star')return;
 const m=b.ore[0],gx=x+s*.5+(m.x-.5)*s*.18,gy=y+s*.45+(m.y-.5)*s*.18,gr=s*.24;
 if(Math.sin(time*3+b.seed*20)>.82)sparkle(gx+gr*.6,gy-gr*.7,s*.09);
}
function makeCache(b,s){
 const px=Math.max(1,Math.ceil(s*DPR));
 const c=document.createElement('canvas');c.width=c.height=px;
 const main=ctx;ctx=c.getContext('2d');ctx.scale(px/s,px/s);
 const r=Math.max(5,s*.1);
 const g=ctx.createLinearGradient(0,0,s,s);g.addColorStop(0,rgb(b.c,1.42));g.addColorStop(1,rgb(b.c,.95));
 rrect(0,0,s,s,r);ctx.fillStyle=g;ctx.fill();
 ctx.save();rrect(0,0,s,s,r);ctx.clip();
 for(const p of b.pb){ctx.fillStyle=p.l?'rgba(255,255,255,.1)':'rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(p.x*s,p.y*s,p.r*s,p.r*s*.75,p.x*6,0,7);ctx.fill()}
 if(b.t.id!=='star')ore(b,0,0,s);
 ctx.restore();
 ctx=main;b.cv=c;b.cvs=cacheKey;
}
function drawBlock(b,x,y,s){
 const r=Math.max(5,s*.1);
 if(!b.cv||b.cvs!==cacheKey)makeCache(b,s);
 ctx.drawImage(b.cv,x,y,s,s);
 if(b.t.id==='star')ore(b,x,y,s);
 twinkle(b,x,y,s);
 const dmg=Math.min(1,b.prog);
 if(dmg>0||b.flash>.02){
  ctx.save();rrect(x,y,s,s,r);ctx.clip();
  if(dmg>0){
   const n=Math.max(1,Math.ceil(dmg*b.cr.length));
   for(let i=0;i<n;i++){
    const pl=b.cr[i],len=Math.min(pl.length,1+Math.ceil(dmg*(pl.length-1)+.01));
    ctx.beginPath();
    for(let k=0;k<len;k++){const px=x+pl[k][0]*s,py=y+pl[k][1]*s;if(k)ctx.lineTo(px,py);else ctx.moveTo(px,py)}
    ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=1.8;ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=.7;ctx.stroke();
   }
   ctx.fillStyle='rgba(0,0,0,'+(dmg*.25)+')';ctx.fillRect(x,y,s,s);
  }
  if(b.flash>.02){ctx.fillStyle='rgba(255,255,255,'+(b.flash*.35)+')';ctx.fillRect(x,y,s,s)}
  ctx.restore();
 }
 rrect(x+.75,y+.75,s-1.5,s-1.5,r);ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.2;ctx.stroke();
 rrect(x,y,s,s,r);ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=1.5;ctx.stroke();
}
function drawBlocks(){
 for(let k=0;k<blocks.length;k++){
  const y=tipY-2-(row*step-scrollOff)*(1-vpE)+5+(row+k)*step;
  if(y>H+step)break;
  const b=blocks[k],sx=k===0?b.shake*Math.sin(time*120)*2.5:0;
  drawBlock(b,cx-bs/2+sx,y,bs);
  if(k===0&&b.prog>.01){
   const bw=bs*.72,bx=cx-bw/2+sx,by=y+bs-bs*.2;
   ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx-1,by-1,bw+2,9);
   ctx.fillStyle=COL[b.t.id];ctx.fillRect(bx,by,bw*Math.min(1,b.prog),7);
   ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(bx,by,bw*Math.min(1,b.prog),2);
  }
 }
}

function metalH(x0,x1,y,stops){const g=ctx.createLinearGradient(x0,y,x1,y);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function drawRig(){
 const sx=drilling?Math.sin(time*80)*1.3:0,sy=drilling?Math.cos(time*97)*.7:0;
 const X=cx+sx,R=tipY-rigY0,e=eng*eng*(3-2*eng);
 const bw=bs*1.9,bx=X-bw/2,by=rigY0;
 let g=ctx.createLinearGradient(0,by,0,by+16);g.addColorStop(0,'#b4bac1');g.addColorStop(.5,'#6d737a');g.addColorStop(1,'#3b3f44');
 rrect(bx,by,bw,16,4);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#15171a';ctx.lineWidth=1.2;ctx.stroke();
 for(const ex of [bx-6,bx+bw-14]){
  ctx.save();rrect(ex,by-4,20,24,4);ctx.fillStyle='#e6a800';ctx.fill();ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=4;
  for(let k=-2;k<4;k++){ctx.beginPath();ctx.moveTo(ex+k*8,by+20);ctx.lineTo(ex+k*8+16,by-4);ctx.stroke()}
  ctx.restore();rrect(ex,by-4,20,24,4);ctx.strokeStyle='#15171a';ctx.lineWidth=1.2;ctx.stroke();
 }
 const ch=R*.08,cylB=by+16+ch;
 const mh=R*.2,chh=R*.05,bitH=R*.25;
 const mYe=rigY0+R*.5,mYr=cylB+8;
 const mY=mYr+(mYe-mYr)*e+sy;
 ctx.fillStyle=metalH(X-4.5,X+4.5,0,[[0,'#6a7076'],[.45,'#f0f3f5'],[1,'#50555b']]);
 ctx.fillRect(X-4.5,by+16,9,mY-(by+16)+4);
 rrect(X-11,by+16,22,ch,3);ctx.fillStyle=metalH(X-11,X+11,0,[[0,'#3b4046'],[.4,'#aeb4ba'],[1,'#3b4046']]);ctx.fill();ctx.strokeStyle='#15171a';ctx.lineWidth=1.2;ctx.stroke();
 const mw=bs*.68;
 rrect(X-mw/2,mY,mw,mh,7);ctx.fillStyle=metalH(X-mw/2,X+mw/2,0,[[0,'#3f4449'],[.3,'#9aa1a8'],[.55,'#d3d8dc'],[1,'#454a50']]);ctx.fill();
 ctx.strokeStyle='#14161a';ctx.lineWidth=1.3;ctx.stroke();
 for(let yy=mY+mh*.62;yy<mY+mh-5;yy+=5){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(X-mw/2+3,yy,mw-6,2);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(X-mw/2+3,yy+2,mw-6,1)}
 const bandH=Math.max(7,mh*.2),bandY=mY+mh*.32;
 ctx.fillStyle=BAND[Math.min(3,Math.floor((lvl-1)/3))];ctx.fillRect(X-mw/2+1,bandY,mw-2,bandH);
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(X-mw/2+1,bandY+bandH*.55,mw-2,bandH*.45);
 ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(X-mw/2+1,bandY,mw-2,1.5);
 ctx.save();const lc=drilling?'#ffb020':'#38e07a';ctx.shadowColor=lc;ctx.shadowBlur=9;
 ctx.fillStyle=lc;ctx.beginPath();ctx.arc(X,mY+mh*.14,3.5,0,7);ctx.fill();ctx.restore();
 const cy0=mY+mh,cw=mw*.62;
 ctx.beginPath();ctx.moveTo(X-cw/2,cy0);ctx.lineTo(X+cw/2,cy0);ctx.lineTo(X+cw*.36,cy0+chh);ctx.lineTo(X-cw*.36,cy0+chh);ctx.closePath();
 ctx.fillStyle=metalH(X-cw/2,X+cw/2,0,[[0,'#1d2023'],[.5,'#5b6167'],[1,'#1d2023']]);ctx.fill();ctx.strokeStyle='#0b0c0e';ctx.stroke();
 const y0=cy0+chh,w0=bs*.46,tipN=y0+bitH;
 ctx.save();ctx.beginPath();
 ctx.moveTo(X-w0/2,y0);ctx.lineTo(X+w0/2,y0);ctx.lineTo(X,tipN);ctx.closePath();
 ctx.fillStyle=metalH(X-w0/2,X+w0/2,0,[[0,'#6b7279'],[.4,'#f2f5f7'],[1,'#596067']]);ctx.fill();
 ctx.clip();
 for(let i=-1;i<9;i++){
  const yy=y0+((i*bitH/6+phase)%(bitH+bitH/6))-bitH/12;
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X-w0/2,yy);ctx.lineTo(X+w0/2,yy+9);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(X-w0/2,yy+3);ctx.lineTo(X+w0/2,yy+12);ctx.stroke();
 }
 ctx.restore();
 ctx.beginPath();ctx.moveTo(X-w0/2,y0);ctx.lineTo(X,tipN);ctx.lineTo(X+w0/2,y0);
 ctx.strokeStyle='#14161a';ctx.lineWidth=1.2;ctx.stroke();
}

function drawFX(){
 for(const p of parts){
  const a=Math.max(0,Math.min(1,p.life/p.max));
  if(p.k==='spark'){
   ctx.strokeStyle=p.col;ctx.globalAlpha=a;ctx.lineWidth=p.s;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();
  }else if(p.k==='chip'){
   ctx.fillStyle=p.col;ctx.globalAlpha=Math.min(1,a*1.6);ctx.fillRect(p.x,p.y,p.s,p.s*.8);
  }else{
   ctx.fillStyle='rgba('+p.col+','+(a*.35)+')';ctx.globalAlpha=1;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();
  }
 }
 ctx.globalAlpha=1;ctx.lineCap='butt';
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const f of floats){
  const a=Math.min(1,f.life/f.max*1.8);
  ctx.globalAlpha=a;ctx.font=(f.big?'800 20px':'800 16px')+' system-ui,sans-serif';
  ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(f.t,f.x,f.y);
  ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y);
 }
 ctx.globalAlpha=1;
}

function draw(){
 drawBG();
 drawBlocks();
 if(eng>.02){
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.24*eng;
  ctx.drawImage(glowCv,cx-bs*2,tipY-bs*1.5,bs*4,bs*4);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 }
 drawRig();
 drawFX();
 const depthFt=(row+1)*10*(1-vpE);
 ctx.globalAlpha=.38+Math.min(.32,depthFt/2500);
 ctx.drawImage(vigCv,0,0,W,H);
 ctx.globalAlpha=1;
}

const dEl=$('depth'),mEl=$('money'),lvEl=$('lv'),hEl=$('hint');
let lD='',lM='',lL='',lH=null,lU='',lT='',lS='';
function hud(){
 const dd=Math.round((row+1)*10*(1-vpE));const d=(dd?'-'+dd:'0')+' ft';if(d!==lD){dEl.textContent=d;lD=d}
 const m='$'+Math.round(disp).toLocaleString('en-US');if(m!==lM){mEl.textContent=m;lM=m}
 const l=lvl>=MAXL?'MAX':'LV '+lvl;if(l!==lL){lvEl.textContent=l;lL=l}
 const u=lvl>=MAXL?'dis':money>=UCOST?'ready':'dis';if(u!==lU){upEl.className=u;lU=u}
 const idle=mode==='dig'||mode==='surf';
 const ht=mode==='surf'?'HOLD TO GO DOWN':'HOLD TO DRILL';if(ht!==lT){hEl.textContent=ht;lT=ht}
 const sm=started&&idle?mode:'x';
 if(sm!==lS){lS=sm;const sb=$('surf');sb.classList.toggle('off',sm==='x');sb.classList.toggle('down',sm==='surf');$('surfT').textContent=sm==='surf'?'GO DOWN':'SURFACE'}
 const showHint=started&&!holding&&idle;
 if(showHint!==lH){hEl.classList.toggle('off',!showHint);lH=showHint}
}

function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 update(dt);draw();hud();
 requestAnimationFrame(frame);
}
requestAnimationFrame(ts=>{last=ts;frame(ts)});
})();
</script>
